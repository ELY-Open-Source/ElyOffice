<script>
(function () {
  var tl = gsap.timeline({ paused: true });

    function ft(el, a, b, at) { tl.fromTo(el, a, Object.assign({}, b, IF), at); }

      var step = dur / (vals.length - 1);

    var ARROW = '<svg class="ico s7-ar" viewBox="0 0 24 24"><path d="M4 12h15"/><path d="m13 6 6 6-6 6"/></svg>';

    var html = "";

    var DROPS = [["orders@kettle.shop", "#FFB46B"], ["周雨桐", "#FF5FA8"], ["deals@pixel.shop", "#FFB46B"], ["林晓", "#3ddc84"]];

    });
    html += '<div class="s7-bub" id="s7-bubR" style="left:1030px;top:712px">' + I("folder") + "<b>Receipts</b><div class=\"n\"><span>0</span><span>1</span><span>2</span></div></div>";

    html += '<div id="s7-star">' + I("star") + "</div>";

    /* contacts + vCard */
    html += '<div id="s7-chead"><b>联系人</b><div class="s7-chip">' + I("download") + '导入 vCard</div><div class="s7-chip">' + I("upload") + "导出 vCard</div></div>";
    html += '<div class="glass" id="s7-vcf">' + I("contacts") + "<b>.vcf</b><span>联系人.vcf</span></div>";
    var CT = [["周", "周雨桐", "yutong.zhou@gmail.com"], ["林", "林晓", "lin.xiao@icloud.com"], ["M", "Marco Rossi", "marco@rossi.studio"], ["陈", "陈默", "chenmo@outlook.com"]];
    CT.forEach(function (c, i) {
      var y = 300 + i * 88;

    });
    html += '<div id="s7-cnote">' + I("send") + "从已发邮件自动收集 · 也可手动添加</div>";

    html += '<div id="s7-done">' + I("check") + "</div>";

    /* desktop */

    html += '<div class="glass" id="s7-tip">' + I("sync") + "ElyMail 在托盘里 · 同步和发件箱照常运行</div>";

    var $ = function (id) { return document.getElementById(id); };

    /* ===== A. rules (0 → 3.3) ===== */
    ft(fade, { scale: 1, y: 0 }, { scale: 0.9, y: 30, duration: 0.42, ease: "power3.in" }, 0.12);

    popIn($("s7-rule"), 0.34, { x: -40 });

    var MELT = [0.8, 1.2, 1.6, 2.0];
    var FORK = MELT.map(function (m) { return m + 0.56; });
    var LAND = MELT.map(function (m) { return m + 0.88; });
    MELT.forEach(function (m, i) {
      var mc = $("s7-mc" + i);
      ft(mc, { opacity: 0, scale: 0.5, y: -30 }, { opacity: 1, scale: 1, y: 0, duration: 0.3, ease: "back.out(2.4)" }, m - 0.3);
      ft(mc, { opacity: 1, scaleX: 1, scaleY: 1 }, { opacity: 0, scaleX: 0.4, scaleY: 0.2, duration: 0.14, ease: "power2.in" }, m);
    });
    var bubR = $("s7-bubR"), bubI = $("s7-bubI");
    popIn(bubR, 0.62); popIn(bubI, 0.68);
    function counter(el, steps) {
      var sp = el.querySelectorAll(".n span");
      ft(sp[0], { opacity: 0 }, { opacity: 1, duration: 0.2 }, 0.8);
      steps.forEach(function (at, i) {
        ft(sp[i], { opacity: 1, y: 0 }, { opacity: 0, y: -12, duration: 0.14 }, at);
        ft(sp[i + 1], { opacity: 0, y: 12 }, { opacity: 1, y: 0, duration: 0.24, ease: "back.out(2.4)" }, at + 0.04);
      });
    }
    counter(bubR, [LAND[0], LAND[2]]);
    counter(bubI, [LAND[1], LAND[3]]);
    /* the matching rule lights up as each drop reaches the fork */
    function flash(id, at) {

      pulse($(id), "scale", [1, 1.035, 1], at, 0.26);

    flash("s7-rl0", FORK[0]); flash("s7-rl1", FORK[1]); flash("s7-rl0", FORK[2]);
    var star = $("s7-star");
    ft(star, { opacity: 0, scale: 0.2, rotation: -90, y: 30 }, { opacity: 1, scale: 1, rotation: 0, y: 0, duration: 0.5, ease: "back.out(3)" }, LAND[1] + 0.02);

    popOut(bubR, 3.04, 0.24); popOut(bubI, 3.08, 0.24); popOut(star, 3.0, 0.24);

    /* ===== B. contacts, vCard, MBOX, EML (3.3 → 5.85) ===== */
    popIn($("s7-chead"), 3.3, { x: -30 });

    var BUB = [3.5, 3.62, 3.74, 3.86];
