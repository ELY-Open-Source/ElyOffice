<!doctype html>
<html>
<head><meta charset="UTF-8" /></head>
<body>
<template>
<style>
@font-face { font-family: "Inter"; src: url("assets/fonts/Inter.ttf"); font-weight: 100 900; }
@font-face { font-family: "Noto Sans SC"; src: url("assets/fonts/NotoSansSC.ttf"); font-weight: 100 900; }
#s3-root { position: absolute; inset: 0; pointer-events: none; }
#s3-win .s3-bar { position: absolute; left: 0; right: 0; top: 0; height: 56px; display: flex; align-items: center; gap: 14px; padding: 0 22px; border-bottom: 1px solid var(--line); }
#s3-win .s3-dots { display: flex; gap: 9px; }
#s3-win .s3-dots i { display: block; width: 13px; height: 13px; border-radius: 50%; }
#s3-win .s3-dots i:nth-child(1) { background: #ff6b6b; } #s3-win .s3-dots i:nth-child(2) { background: #ffc44d; } #s3-win .s3-dots i:nth-child(3) { background: #3ddc84; }
#s3-win .s3-name { font: 700 19px var(--sans); display: flex; align-items: center; gap: 10px; }
#s3-win .s3-name img { width: 28px; height: 28px; }
#s3-view { margin-left: 24px; height: 36px; padding: 0 16px; border-radius: 10px; display: flex; align-items: center; font: 600 18px var(--zh); color: var(--ink); background: rgba(255,255,255,.08); border: 1px solid var(--line); }
#s3-page-n { margin-left: auto; font: 600 18px var(--sans); color: var(--ink-2); font-variant-numeric: tabular-nums; }
#s3-body { position: absolute; left: 0; right: 0; top: 56px; bottom: 0; overflow: hidden; }
.s3-page { position: absolute; left: 0; top: 0; width: 300px; height: 424px; border-radius: 10px; background: #fbfaf7; box-shadow: 0 18px 40px rgba(10, 4, 30, 0.45); padding: 34px 30px; }
.s3-page .h { height: 18px; width: 70%; border-radius: 4px; background: #2b2a3a; margin-bottom: 22px; }
.s3-page .l { height: 9px; border-radius: 3px; background: #c9c7d2; margin-bottom: 11px; }
.s3-page .fig { height: 96px; border-radius: 8px; margin: 14px 0 18px; }
.s3-page .n { position: absolute; left: 0; right: 0; bottom: 16px; text-align: center; font: 600 14px var(--sans); color: #8a8796; }
#s3-menu { position: absolute; left: 0; top: 0; width: 240px; padding: 8px; border-radius: 16px; }
.s3-item { position: relative; height: 46px; border-radius: 10px; display: flex; align-items: center; gap: 10px; padding: 0 14px 0 40px; font: 600 19px var(--zh); color: var(--ink); }
.s3-item .ico { position: absolute; left: 12px; width: 18px; height: 18px; stroke-width: 2.6; color: #7cf0b0; }
#s3-hl { position: absolute; left: 8px; width: 224px; height: 46px; border-radius: 10px; background: rgba(224, 52, 79, 0.55); }
#s3-keys { position: absolute; left: 0; top: 0; display: flex; align-items: center; gap: 12px; height: 60px; padding: 0 20px; font: 700 22px var(--sans); }
#s3-keys .cap { height: 40px; padding: 0 14px; border-radius: 10px; display: flex; align-items: center; background: linear-gradient(180deg, rgba(255,255,255,.3), rgba(255,255,255,.1)); border: 1px solid rgba(255,255,255,.4); box-shadow: 0 4px 0 rgba(0,0,0,.25); }
#s3-keys .ico { width: 30px; height: 30px; }
#s3-keys .plus { opacity: .7; }
</style>
<div id="s3-root" data-composition-id="s3" data-width="1920" data-height="1080" data-duration="6">
  <div id="s3-win" class="glass">
    <div class="s3-bar"><div class="s3-dots"><i></i><i></i><i></i></div><div class="s3-name"><img src="assets/icons/ely-pdf.svg" alt="">report.pdf — ElyPDF</div><div id="s3-view">视图</div><div id="s3-page-n"></div></div>
    <div id="s3-body"></div>
  </div>
  <div id="s3-menu" class="glass solid"><div id="s3-hl"></div></div>
  <div id="s3-keys" class="glass solid"></div>
</div>
<script>
(function () {
  var tl = gsap.timeline({ paused: true });
  try {
    var W = window.__s3.W;
    function clamp(x, a, b) { return x < a ? a : x > b ? b : x; }
    function prog(t, a, b) { return clamp((t - a) / (b - a), 0, 1); }
    function smooth(x) { x = clamp(x, 0, 1); return x * x * (3 - 2 * x); }
    function inOut(x) { x = clamp(x, 0, 1); return x < 0.5 ? 4 * x * x * x : 1 - Math.pow(-2 * x + 2, 3) / 2; }
    function backOut(x, s) { s = s == null ? 1.7 : s; x = clamp(x, 0, 1) - 1; return 1 + (s + 1) * x * x * x + s * x * x; }

    var win = document.getElementById("s3-win");
    win.style.left = W.x + "px"; win.style.top = W.y + "px"; win.style.width = W.w + "px"; win.style.height = W.h + "px";
    var body = document.getElementById("s3-body");
    var FIG = ["#e0344f", "#7b5cff", "#2fd8e8", "#ffb46b", "#2e9e5b", "#ff5fa8", "#3d7fe5"];
    var pages = [];
    for (var i = 0; i < 7; i++) {
      var p = document.createElement("div");
      p.className = "s3-page";
      var html = '<div class="h"></div>';
      for (var k = 0; k < 4; k++) html += '<div class="l" style="width:' + (96 - ((i * 7 + k * 13) % 30)) + '%"></div>';
      html += '<div class="fig" style="background:linear-gradient(135deg,' + FIG[i] + ',' + FIG[(i + 3) % 7] + ')"></div>';
      for (var k2 = 0; k2 < 5; k2++) html += '<div class="l" style="width:' + (98 - ((i * 11 + k2 * 17) % 34)) + '%"></div>';
      p.innerHTML = html + '<div class="n">' + (i + 1) + "</div>";
      body.appendChild(p);
      pages.push(p);
    }
    var pageN = document.getElementById("s3-page-n");
    var menu = document.getElementById("s3-menu"), hl = document.getElementById("s3-hl");
    var ITEMS = ["连续滚动", "单页", "双页", "横向滚动"];
    var items = ITEMS.map(function (t, n) {
      var el = document.createElement("div");
      el.className = "s3-item";
      el.innerHTML = (n === 0 ? ElyKit.icon("check") : "") + t;
      menu.appendChild(el);
      return el;
    });
    var keys = document.getElementById("s3-keys");
    keys.innerHTML = '<span class="cap">Shift</span><span class="plus">+</span>' + ElyKit.icon("mouse") + '<span style="font:600 20px var(--zh)">滚轮</span>';
    /* menu hangs under the View button */
    var MX = W.x + 330, MY = W.y + 60;

    function apply(lt) {
      var out = smooth(prog(lt, 4.85, 5.1));
      var wi = smooth(prog(lt, 0.62, 0.95));
      win.style.opacity = (wi * (1 - out)).toFixed(3);
      win.style.transform = "scale(" + ((0.97 + 0.03 * backOut(prog(lt, 0.62, 1.0), 1.4)) * (1 - 0.03 * out)).toFixed(4) + ")";

      /* column: scrolls gently; row: lands on 4.0, then Shift + wheel slides it */
      var scroll = 120 * smooth(prog(lt, 1.0, 2.6));
      var slide = 720 * inOut(prog(lt, 4.3, 5.0));
      for (var i = 0; i < 7; i++) {
        var cx = 650, cy = 30 + i * 452 - scroll;
        var rx = 120 + i * 360 - slide, ry = 110;
        var u = prog(lt, 2.8 + i * 0.07, 3.6 + i * 0.07);
        var e = u < 1 ? backOut(u, 1.2) : 1;
        var sq = 1 + 0.06 * Math.exp(-7 * Math.max(lt - 4.0, 0)) * Math.sin(2 * Math.PI * 3 * Math.max(lt - 4.0, 0)) * (lt > 4.0 ? 1 : 0);
        var x = cx + (rx - cx) * e, y = cy + (ry - cy) * e;
        var o = smooth(prog(lt, 0.8 + i * 0.05, 1.1 + i * 0.05));
        pages[i].style.transform = "translate(" + x.toFixed(2) + "px," + y.toFixed(2) + "px) scale(" + (1 / sq).toFixed(4) + "," + sq.toFixed(4) + ")";
        pages[i].style.opacity = o.toFixed(3);
      }
      pageN.textContent = (lt < 4.65 ? 1 : 3) + " / 7";

      /* View menu: open, hover down to 横向滚动, click, close */
      var mo = smooth(prog(lt, 1.4, 1.6)) * (1 - smooth(prog(lt, 2.75, 2.95)));
      menu.style.transform = "translate(" + MX + "px," + (MY + 10 * (1 - backOut(prog(lt, 1.4, 1.7), 2))) + "px)";
      menu.style.opacity = mo.toFixed(3);
      var row = lt < 1.9 ? 0 : lt < 2.05 ? 1 : lt < 2.2 ? 2 : 3;
      hl.style.top = 8 + row * 46 + "px";
      hl.style.opacity = lt > 1.75 ? 1 : 0;
      var chosen = lt >= 2.6;
      items[0].innerHTML = (chosen ? "" : ElyKit.icon("check")) + ITEMS[0];
      items[3].innerHTML = (chosen ? ElyKit.icon("check") : "") + ITEMS[3];
      var press = 1 - 0.06 * Math.sin(Math.PI * prog(lt, 2.5, 2.7));
      hl.style.transform = "scale(" + press.toFixed(4) + ")";

      /* Shift + wheel keycaps while the row slides */
      var kp = prog(lt, 4.15, 4.45), ko = smooth(kp) * (1 - out);
      keys.style.transform = "translate(" + (W.x + 40) + "px," + (W.y + W.h - 96) + "px) scale(" + backOut(kp, 2.4).toFixed(4) + ")";
      keys.style.opacity = ko.toFixed(3);
    }

    var proxy = { t: 0 };
    tl.to(proxy, { t: 6, duration: 6, ease: "none", onUpdate: function () { apply(proxy.t); } }, 0);
    apply(0);
  } finally {
    window.__timelines["s3"] = tl;
  }
})();
</script>
</template>
</body>
</html>
