(function () {
  var P = 160, S = 3.2, CX = 540, CY = 470 + 96 * S;
  var NS = "http://www.w3.org/2000/svg";

  function dir(a, b) { var dx = b[0] - a[0], dy = b[1] - a[1], l = Math.hypot(dx, dy); return [dx / l, dy / l]; }
  // Vertices [x, y, cornerRadius]; corners are quadratic fillets.
  function rpoly(v) {
    var out = [], n = v.length;
    for (var i = 0; i < n; i++) {
      var c = v[i], r = c[2] || 0;
      if (!r) { out.push([c[0], c[1]]); continue; }
      var a = dir(c, v[(i - 1 + n) % n]), b = dir(c, v[(i + 1) % n]);
      var p1 = [c[0] + a[0] * r, c[1] + a[1] * r], p2 = [c[0] + b[0] * r, c[1] + b[1] * r];
      for (var k = 0; k <= 10; k++) {
        var t = k / 10, u = 1 - t;
        out.push([u * u * p1[0] + 2 * u * t * c[0] + t * t * p2[0], u * u * p1[1] + 2 * u * t * c[1] + t * t * p2[1]]);
      }
    }
    return out;
  }
  function rrect(x, y, w, h, r) { return rpoly([[x, y, r], [x + w, y, r], [x + w, y + h, r], [x, y + h, r]]); }
  function circle(cx, cy, r) {
    var out = [];
    for (var k = 0; k < 240; k++) { var a = -Math.PI / 2 + k / 240 * Math.PI * 2; out.push([cx + Math.cos(a) * r, cy + Math.sin(a) * r]); }
    return out;
  }
  function star(cx, cy, ro, ri) {
    var v = [];
    for (var k = 0; k < 10; k++) { var a = -Math.PI / 2 + k * Math.PI / 5, r = k % 2 ? ri : ro; v.push([cx + Math.cos(a) * r, cy + Math.sin(a) * r, k % 2 ? 0 : 3]); }
    return rpoly(v);
  }
  // Outline of an open polyline stroked at width w with round caps.
  function stroke(pts, w) {
    var h = w / 2, n = pts.length, left = [], right = [], norms = [];
    for (var i = 0; i < n; i++) {
      var d = dir(pts[Math.max(0, i - 1)], pts[Math.min(n - 1, i + 1)]);
      norms.push([-d[1], d[0]]);
      left.push([pts[i][0] + norms[i][0] * h, pts[i][1] + norms[i][1] * h]);
      right.push([pts[i][0] - norms[i][0] * h, pts[i][1] - norms[i][1] * h]);
    }
    function cap(p, nn, d) {
      var out = [];
      for (var k = 1; k < 16; k++) { var a = k / 16 * Math.PI; out.push([p[0] + h * (Math.cos(a) * nn[0] + Math.sin(a) * d[0]), p[1] + h * (Math.cos(a) * nn[1] + Math.sin(a) * d[1])]); }
      return out;
    }
    var dEnd = dir(pts[n - 2], pts[n - 1]), dStart = dir(pts[1], pts[0]);
    return left.concat(cap(pts[n - 1], norms[n - 1], dEnd), right.reverse(), cap(pts[0], [-norms[0][0], -norms[0][1]], dStart));
  }
  function cubic(p0, p1, p2, p3) {
    var out = [];
    for (var k = 0; k <= 40; k++) {
      var t = k / 40, u = 1 - t;
      out.push([u * u * u * p0[0] + 3 * u * u * t * p1[0] + 3 * u * t * t * p2[0] + t * t * t * p3[0],
                u * u * u * p0[1] + 3 * u * u * t * p1[1] + 3 * u * t * t * p2[1] + t * t * t * p3[1]]);
    }
    return out;
  }
  function line(a, b) { var out = []; for (var k = 0; k <= 20; k++) out.push([a[0] + (b[0] - a[0]) * k / 20, a[1] + (b[1] - a[1]) * k / 20]); return out; }

  // Evenly spaced by arc length, clockwise on screen.
  function resample(poly) {
    var n = poly.length, cum = [0];
    for (var i = 1; i <= n; i++) cum.push(cum[i - 1] + Math.hypot(poly[i % n][0] - poly[i - 1][0], poly[i % n][1] - poly[i - 1][1]));
    var out = [], j = 0, L = cum[n];

  function centroid(pts) { var x = 0, y = 0; pts.forEach(function (p) { x += p[0]; y += p[1]; }); return [x / pts.length, y / pts.length]; }

    { land: 5, dur: 0.4, glow: APP[3], slots: [[rpoly(PAGE), APP[3]]] },
    { land: 6, dur: 0.4, glow: APP[4], slots: [[rrect(16, 40, 160, 112, 12), APP[4]]] },

      [stroke(cubic([64, 128], [64, 92], [128, 104], [128, 72]), 20), APP[5]],
      [circle(64, 40, 24), APP[5]], [circle(128, 64, 24), APP[5]], [circle(64, 152, 24), "#F2A900"]] },
    { land: 8, dur: 0.4, glow: "#B0B0B0", slots: [[rrect(28, 24, 136, 152, 10), "#ECECEC"],
      [rpoly([[44, 156], [44, 76], [66, 76], [82, 100], [98, 76], [120, 76], [120, 156], [100, 156], [100, 110], [82, 136], [64, 110], [64, 156]]), "#3E4A5C"],

        if (d < bestD) { bestD = d; best = sh; }

  var raysG = document.getElementById("m-rays"), rays = [];

  var shape = document.getElementById("m-shape"), glow = document.getElementById("m-glow");
  var num = document.getElementById("m-num");
  var icons = Array.prototype.slice.call(document.querySelectorAll("#m-icons > g"));
  var details = Array.prototype.slice.call(document.querySelectorAll("#m-shape [data-state]"));
  details.forEach(function (g) {
    g.querySelectorAll("[data-wipe],[data-grow]").forEach(function (el) {
      el._w = +el.getAttribute("width"); el._h = +el.getAttribute("height"); el._y = +el.getAttribute("y");

  function clamp(x) { return x < 0 ? 0 : x > 1 ? 1 : x; }
  function ease(p) { return p < 0.5 ? 4 * p * p * p : 1 - Math.pow(-2 * p + 2, 3) / 2; }
  function back(p) { var c = 2.2; return 1 + (c + 1) * Math.pow(p - 1, 3) + c * Math.pow(p - 1, 2); }
  function rgb(h) { return [parseInt(h.substr(1, 2), 16), parseInt(h.substr(3, 2), 16), parseInt(h.substr(5, 2), 16)]; }
  function mix(a, b, e) { var x = rgb(a), y = rgb(b); return "rgb(" + [0, 1, 2].map(function (i) { return Math.round(x[i] + (y[i] - x[i]) * e); }).join(",") + ")"; }
  function morphStart(i) { return STATES[i].land - STATES[i].dur; }
  function slotPts(st, s) { if (st.pts[s]) return st.pts[s]; var h = st.hub, out = []; for (var k = 0; k < P; k++) out.push(h); return out; }
  function slotColor(st, other, s) { return (st.slots[s] || other.slots[s] || [0, "#FFFFFF"])[1]; }

  function render(t) {
    var i = 0;
    for (var k = STATES.length - 1; k > 0; k--) if (t >= morphStart(k)) { i = k; break; }
    var B = STATES[i], A = STATES[Math.max(0, i - 1)];
    var e = i === 0 ? 1 : ease(clamp((t - morphStart(i)) / B.dur));
    var p = i === 0 ? 1 : clamp((t - morphStart(i)) / B.dur);
    if (i === 0) A = B;

    for (var s = 0; s < SLOTS; s++) {
      var pa = slotPts(A, s), pb = slotPts(B, s), d = "";
      if (!A.pts[s] && !B.pts[s]) { paths[s].setAttribute("d", ""); continue; }
      for (var m = 0; m < P; m++) {
        d += (m ? "L" : "M") + (pa[m][0] + (pb[m][0] - pa[m][0]) * e).toFixed(2) + " " + (pa[m][1] + (pb[m][1] - pa[m][1]) * e).toFixed(2);
      }
      paths[s].setAttribute("d", d + "Z");
      paths[s].setAttribute("fill", mix(slotColor(A, B, s), slotColor(B, A, s), e));
    }

    // Squash on landing, a small dip mid-morph, a beat pulse while idle.
    var sx = 1, sy = 1, rot = 0;
    if (i === 0) { sx = sy = 1 + 0.06 * Math.exp(-(t % 1) * 7); }
    else if (p < 1) { sx = sy = 1 - 0.07 * Math.sin(Math.PI * p); }
    else {
      var dt = t - B.land, w = 0.1 * Math.exp(-dt * 6) * Math.sin(dt * Math.PI * 2 * 2.6);
      sx = 1 + w; sy = 1 - w;
    }
    if (i === STATES.length - 1 && p >= 1) rot = (t - B.land) * 3;
    shape.setAttribute("transform", "translate(" + CX + " " + CY + ") rotate(" + rot.toFixed(3) + ") scale(" + (S * sx).toFixed(4) + " " + (S * sy).toFixed(4) + ") translate(-96 -96)");

    var gc = mix(A.glow, B.glow, e);
    glow.style.background = "radial-gradient(circle, " + gc.replace("rgb", "rgba").replace(")", ",0.30)") + " 0%, rgba(37,37,37,0) 62%)";

    details.forEach(function (g) {
      var si = +g.getAttribute("data-state"), land = STATES[si].land, end = morphStart(si + 1);
      var o = Math.min(clamp((t - land - 0.03) / 0.14), clamp((end - t) / 0.1));
      g.setAttribute("opacity", o.toFixed(3));
      g.querySelectorAll("[data-wipe]").forEach(function (el) {
        var f = ease(clamp((t - land - 0.06 - el.getAttribute("data-wipe") * 0.05) / 0.2));
        el.setAttribute("width", Math.max(0.01, el._w * f).toFixed(2));
      });
      g.querySelectorAll("[data-grow]").forEach(function (el) {
        var f = back(clamp((t - land - 0.08 - el.getAttribute("data-grow") * 0.07) / 0.3));
        el.setAttribute("height", Math.max(0.01, el._h * f).toFixed(2));
        el.setAttribute("y", (el._y + el._h * (1 - f)).toFixed(2));
      });
    });

    // The suite's dots hand over to the real icons, and back before the star.
    for (var c = 0; c < 7; c++) {
      var t0 = 9.05 + c * 0.08;
      var a = Math.min(clamp((t - t0) / 0.08), clamp((11.42 - t) / 0.12));
      var sc = (t < 11.3 ? back(clamp((t - t0) / 0.3)) : 1 - 0.4 * clamp((t - 11.3) / 0.12));
      icons[c].setAttribute("opacity", a.toFixed(3));
      icons[c].setAttribute("transform", "translate(" + ring[c][0] + " " + ring[c][1] + ") scale(" + Math.max(0.01, sc).toFixed(3) + ") translate(-30 -30)");
      if (i === 8) paths[c].setAttribute("opacity", (1 - a).toFixed(3));
      else paths[c].setAttribute("opacity", "1");
    }

    var rt = t - 12;
    rays.forEach(function (l, k) {
      var ang = -Math.PI / 2 + (k + 0.5) * Math.PI / 5, f = clamp(rt / 0.6), r1 = 80 + 16 * (1 - Math.pow(1 - f, 3)), len = 12 * (1 - f);
      l.setAttribute("x1", (96 + Math.cos(ang) * r1).toFixed(2)); l.setAttribute("y1", (96 + Math.sin(ang) * r1).toFixed(2));
      l.setAttribute("x2", (96 + Math.cos(ang) * (r1 + len)).toFixed(2)); l.setAttribute("y2", (96 + Math.sin(ang) * (r1 + len)).toFixed(2));
      l.setAttribute("opacity", rt < 0 ? "0" : (1 - f).toFixed(3));
    });

    var n = Math.max(1, Math.min(7, Math.floor(t - 1.88) + 1));
    num.textContent = "0" + n;
    num.style.color = ["#94B9F1", "#8CCAA5", "#F4A36A", "#EE8F9E", "#6DB6EB", "#B39DDB", "#DADADA"][n - 1];
    var since = t - 1.88 - (n - 1);
    num.style.transform = "scale(" + (1 + 0.14 * Math.exp(-Math.max(0, since) * 9)).toFixed(4) + ")";
  }

  var state = { t: 0 };
  var tl = gsap.timeline({ paused: true });
  tl.to(state, { t: 15, duration: 15, ease: "none", onUpdate: function () { render(state.t); } }, 0);

  function show(sel, at, from) {
    tl.fromTo(sel, Object.assign({ opacity: 0, y: 40, scale: 0.92 }, from), { opacity: 1, y: 0, scale: 1, duration: 0.32, ease: "back.out(2)", immediateRender: false }, at);
  }
  function hide(sel, at) { tl.to(sel, { opacity: 0, y: -28, duration: 0.15, ease: "power2.in" }, at); }

  gsap.set(["#m-count", "#m-brand-wrap", "#m-cta", "#m-btn", "#m-url", "#m-plus", "#m-btn-on", ".m-lab", ".m-chip"], { opacity: 0 });
  hide("#m-hook", 1.72);
  show("#m-count", 1.9);
  for (var j = 0; j < 7; j++) {
    show("#m-lab-" + j, 2 + j - 0.12);
    hide("#m-lab-" + j, j < 6 ? 2 + j + 0.6 : 8.45);
  }
  hide("#m-count", 8.45);
  show("#m-brand-wrap", 8.85);
  tl.fromTo(".m-chip", { opacity: 0, y: 40, scale: 0.85 }, { opacity: 1, y: 0, scale: 1, duration: 0.3, ease: "back.out(2.4)", stagger: 0.12, immediateRender: false }, 9.35);
  hide("#m-brand-wrap", 11.4);
  hide(".m-chip", 11.4);
  show("#m-cta", 11.95);
  show("#m-btn", 12.25);
  show("#m-url", 12.45, { y: 20, scale: 1 });
  tl.to("#m-btn", { scale: 0.9, duration: 0.07, ease: "power2.in" }, 12.93);
  tl.to("#m-btn", { scale: 1, duration: 0.4, ease: "back.out(3)" }, 13.0);
  tl.fromTo("#m-btn-on", { opacity: 0 }, { opacity: 1, duration: 0.06, immediateRender: false }, 13.0);
  tl.to("#m-btn-off", { opacity: 0, duration: 0.06 }, 13.0);
  tl.fromTo("#m-plus", { opacity: 0, y: 0 }, { opacity: 1, y: -10, duration: 0.06, immediateRender: false }, 13.02);
  tl.to("#m-plus", { y: -110, duration: 0.9, ease: "power2.out" }, 13.08);
  tl.to("#m-plus", { opacity: 0, duration: 0.3 }, 13.7);

  render(0);
  window.__timelines = window.__timelines || {};
  window.__timelines["morph"] = tl;
})();
</script>
</template>
