[package]
name = "ely-files"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
dunce.workspace = true
ely-platform.workspace = true
log.workspace = true
aes-gcm.workspace = true
getrandom.workspace = true
serde_json.workspace = true
tempfile.workspace = true

[target.'cfg(unix)'.dependencies]
libc.workspace = true

[target.'cfg(not(any(windows, target_os = "macos")))'.dependencies]
unicode-normalization.workspace = true

[target.'cfg(windows)'.dependencies]
windows-sys = { workspace = true, features = ["Win32_System_SystemServices"] }

[target.'cfg(target_os = "macos")'.dependencies]
objc2-core-foundation.workspace = true

[dependencies.keyring]
version = "3"
features = ["apple-native", "windows-native"]

[target.'cfg(target_os = "linux")'.dependencies.keyring]
version = "3"
features = ["linux-native-sync-persistent"]

[lints]
workspace = true
