	<!-- Ely: a Word font that is not installed draws as the free font nearest in width, not as Liberation. -->
	<!-- accept only follows the asked family, so an installed Verdana still wins. -->
	<alias binding="same">
	  <family>Calibri Light</family>
	  <accept>
	  <family>Carlito</family>
	  </accept>
	</alias>

	<alias binding="same">
	  <family>Verdana</family>
	  <accept>
	  <family>DejaVu Sans</family>
	  </accept>
	</alias>

	<alias binding="same">
	  <family>Century Gothic</family>
	  <accept>
	  <family>DejaVu Sans</family>
	  </accept>
	</alias>

	<alias binding="same">
	  <family>Georgia</family>
	  <accept>
	  <family>Noto Serif</family>
	  </accept>
	</alias>

	<alias binding="same">
	  <family>Consolas</family>
	  <accept>
	  <family>Liberation Mono</family>
	  </accept>
	</alias>

	<alias binding="same">
	  <family>Lucida Console</family>
	  <accept>
	  <family>Liberation Mono</family>
	  </accept>
	</alias>
